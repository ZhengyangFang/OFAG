# Store field-case and Agent lessons for retrieval.

lessons:
  - id: F001
    former_id: P19
    title: "SimPEG's \"gz\" is the negative of a gravity anomaly"
    source: case1_forge
    methods: [gravity]
    found_by: development
    tier: measured
    silent: true
    decision: none
    procedure: A2
    covered_by: tests/test_gravity_sign_convention.py
    evidence: "The sharpest finding in either case, and the one that had been wrong in OFAG since the gravity plugin was written."

  - id: F002
    former_id: P20
    title: "The reduction density of the delivered data is not the reduction density of the modelling"
    source: case1_forge
    methods: [gravity]
    found_by: development
    tier: measured
    silent: true
    decision: judgement
    procedure: A8
    covered_by: null
    evidence: "Both numbers ship in the same folder and neither is wrong. The survey's own README, describing the exact column used: *\"gCBGA: Complete Bouguer gravity anomaly using reduction density of 2.67 g/cc\"*, and the ArcGIS metadata says it a second time."

  - id: F003
    former_id: P21
    title: "A bottom-up error budget counts only the terms that were written down"
    source: case1_forge
    methods: [gravity]
    found_by: development
    tier: measured
    silent: true
    decision: measurable
    procedure: A4
    covered_by: tests/test_uncertainty.py
    evidence: "The uncertainty here was first derived rather than taken: errg is 0.001 mGal, the meter's repeatability after processing, and station elevations good to 0.05 m contribute 0.3086 × 0.05 = 0.015 mGal through the free-air gradient and dominate it."

