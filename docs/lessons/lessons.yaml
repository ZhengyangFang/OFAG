  - id: F011
    former_id: P29
    title: "A depth of investigation can measure the mesh instead of the data"
    source: case1_forge
    methods: [gravity]
    found_by: development
    tier: measured
    silent: true
    decision: none
    procedure: C1
    covered_by: tests/test_diagnosis.py
    evidence: "Oldenburg and Li's test is simple and it is the right one to reach for: invert the same data twice against two different reference models, and R = |m_a − m_b| / |reference_a − reference_b| runs from 0 where the data decides to 1 where each run is only repeating what it was given."

