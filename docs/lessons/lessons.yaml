    former_id: P27
    title: "A Gaussian class is the wrong shape for a gradient"
    source: case1_forge
    methods: [gravity, boreholes]
    found_by: development
    tier: measured
    silent: true
    decision: judgement
    procedure: A14
    covered_by: null
    evidence: "Three of the four rock classes here are rocks. The fourth, shallow basin fill, is a depth trend: cuttings from well 58-32 give it falling from ~2.4 g/cm³ at 660 m to ~2.0 at surface, and 2.20 is the midpoint of that, not a value anything has."

